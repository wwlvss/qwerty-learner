name: Local learner regression tests

on:
  push:
    branches: [master, dev/e2e]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --registry=https://registry.npmjs.org
      - name: Install locked dependencies
        run: bash scripts/install-ci.sh
      - name: Install Chromium
        run: yarn playwright install --with-deps chromium
      - name: Test the local app
        run: yarn test:etymology
      - name: Test data preparation
        run: python3 -m unittest discover -s tests/data -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: etymology-test-results
          path: test-results/etymology/
          retention-days: 14
