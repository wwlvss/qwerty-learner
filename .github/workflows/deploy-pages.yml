name: Deploy personal learner to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  REACT_APP_DEPLOY_ENV: pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22 --registry=https://registry.npmjs.org
      - name: Install locked dependencies
        run: bash scripts/install-ci.sh
      - name: Build personal learner
        run: yarn build
      - name: Publish static files
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./build
          enable_jekyll: false
